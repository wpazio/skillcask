[package]
name = "skillcask"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "A lockfile-first package manager for AI agent skills (SKILL.md), backed by Composer repositories"
license = "MIT OR Apache-2.0"
repository = "https://github.com/puniserv/skillcask"
homepage = "https://github.com/puniserv/skillcask"
readme = "README.md"
keywords = ["skills", "agents", "claude", "lockfile", "package-manager"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/tests", "/docs"]

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
jiff = "0.2.38"
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
toml_edit = "0.25.17"
ureq = { version = "3.4.2", features = ["platform-verifier"] }
url = "2.5.8"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unreadable_literal = "allow"        # st_mode constants read as in <sys/stat.h>
many_single_char_names = "allow"    # version parts and short closures are the house style
single_match_else = "allow"         # two-arm match with fallback is the house style
too_many_lines = "allow"            # length reviewed by topic, not a threshold
format_collect = "allow"              # map(format!).collect() reads better than fold + write! for short strings
case_sensitive_file_extension_comparisons = "allow"  # archive paths and URLs are case-sensitive by design
allow_attributes_without_reason = "warn"

[dev-dependencies]
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

# Release builds made by cargo-dist.
[profile.dist]
inherits = "release"
lto = "thin"
